name: Mossyfin / AAOS

on:
  push:
    branches:
      - mossyfin-aaos
  schedule:
    - cron: '17 17 * * 1'
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload the signed AAOS bundle to Google Play internal testing for this manual run
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mossyfin-aaos-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_APPLICATION_ID: com.blazelink.mossyfin
  AAOS_APPLICATION_ID: com.blazelink.mossyfin.aaos
  APP_LABEL: Mossyfin
  AAOS_APP_LABEL: Mossyfin
  AAOS_BUNDLE_DIR: app/build/outputs/bundle/aaosProprietaryRelease
  TARGET_BRANCH: mossyfin-aaos
  UPSTREAM_REPOSITORY: https://github.com/jellyfin/jellyfin-android.git
  UPSTREAM_BRANCH: master

jobs:
  sync-upstream:
    name: Sync upstream Jellyfin
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.sync-result.outputs.should_build }}
      merge_conflicted: ${{ steps.sync-result.outputs.merge_conflicted }}
      merge_state: ${{ steps.sync-result.outputs.merge_state }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Jellyfin upstream
        run: |
          git remote add upstream "${UPSTREAM_REPOSITORY}"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream master
        id: merge-upstream
        continue-on-error: true
        run: |
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "mossyfin-aaos already contains upstream/${UPSTREAM_BRANCH}; nothing to do."
            echo "merge_state=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "merge_state=merged" >> "$GITHUB_OUTPUT"

      - name: Set sync result
        id: sync-result
        run: |
          if [ "${{ steps.merge-upstream.outcome }}" = "success" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "merge_conflicted=false" >> "$GITHUB_OUTPUT"
            echo "merge_state=${{ steps.merge-upstream.outputs.merge_state || 'merged' }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "merge_conflicted=true" >> "$GITHUB_OUTPUT"
            echo "merge_state=conflicted" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect conflicting files
        id: collect-conflicts
        if: steps.sync-result.outputs.merge_conflicted == 'true'
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only --diff-filter=U
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update merge conflict issue
        if: steps.sync-result.outputs.merge_conflicted == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CONFLICT_FILES: ${{ steps.collect-conflicts.outputs.files }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'AAOS upstream merge conflict';
            const conflictFiles = (process.env.CONFLICT_FILES || '').trim();
            const body = [
              'The scheduled AAOS upstream sync could not automatically merge the latest changes from `jellyfin/jellyfin-android` into `mossyfin-aaos`.',
              '',
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Target branch: ${process.env.TARGET_BRANCH}`,
              `Upstream branch: ${process.env.UPSTREAM_BRANCH}`,
              conflictFiles ? '' : null,
              conflictFiles ? 'Conflicting files:' : null,
              conflictFiles ? '```text' : null,
              conflictFiles || null,
              conflictFiles ? '```' : null,
              '',
              'No AAOS build or Play upload was performed because the merge requires manual conflict resolution.'
            ].filter(Boolean).join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

      - name: Fail on merge conflict
        if: steps.sync-result.outputs.merge_conflicted == 'true'
        run: |
          echo "Upstream merge conflicted; issue created or updated."
          exit 1

      - name: Write sync summary
        if: always()
        run: |
          {
            echo '## AAOS Upstream Sync'
            echo ''
            echo "- Result: ${{ steps.sync-result.outputs.merge_state }}"
            echo "- Target branch: ${TARGET_BRANCH}"
            echo "- Upstream branch: ${UPSTREAM_BRANCH}"
            if [ "${{ steps.sync-result.outputs.merge_conflicted }}" = 'true' ]; then
              echo '- Build/upload: skipped due to merge conflict'
              echo ''
              echo '### Conflicting files'
              echo '```text'
              printf '%s\n' "${{ steps.collect-conflicts.outputs.files }}"
              echo '```'
            else
              echo '- Build/upload: continuing in build-aaos job'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-aaos:
    name: Build AAOS bundle
    needs:
      - sync-upstream
    if: >-
      always() &&
      (github.event_name != 'schedule' || needs.sync-upstream.outputs.should_build == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'schedule' && env.TARGET_BRANCH || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set AAOS version
        run: |
          echo "JELLYFIN_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Materialize signing keystore
        shell: bash
        run: |
          test -n "${{ secrets.MOSSYFIN_KEYSTORE_BASE64 }}"
          printf '%s' '${{ secrets.MOSSYFIN_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/mossyfin-upload-key.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/mossyfin-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed AAOS app bundle
        run: |
          ./gradlew bundleAaosProprietaryRelease --stacktrace \
            -Papp.applicationId="${APP_APPLICATION_ID}" \
            -Papp.aaosApplicationId="${AAOS_APPLICATION_ID}" \
            -Papp.appLabel="${APP_LABEL}" \
            -Papp.aaosAppLabel="${AAOS_APP_LABEL}" \
            -Psigning.storeFile="${SIGNING_STORE_FILE}" \
            -Psigning.storePassword="${{ secrets.MOSSYFIN_KEYSTORE_PASSWORD }}" \
            -Psigning.keyAlias="${{ secrets.MOSSYFIN_KEY_ALIAS }}" \
            -Psigning.keyPassword="${{ secrets.MOSSYFIN_KEY_PASSWORD }}" \
            -Pandroid.injected.signing.store.file="${SIGNING_STORE_FILE}" \
            -Pandroid.injected.signing.store.password="${{ secrets.MOSSYFIN_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.MOSSYFIN_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.MOSSYFIN_KEY_PASSWORD }}"

      - name: Upload AAOS bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mossyfin-aaos-bundle
          retention-days: 14
          if-no-files-found: error
          path: ${{ env.AAOS_BUNDLE_DIR }}/*.aab

      - name: Log Play upload mode
        if: >-
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_play))
        run: |
          echo "Play track: internal"
          echo "Play release status: draft"
          echo "Workflow SHA: $GITHUB_SHA"

      - name: Setup Ruby
        if: >-
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_play))
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        if: >-
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_play))
        run: gem install fastlane --no-document

      - name: Upload to Google Play internal testing
        if: >-
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_play))
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundles=("${AAOS_BUNDLE_DIR}"/*.aab)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one AAB in ${AAOS_BUNDLE_DIR}, found ${#bundles[@]}"
            exit 1
          fi

          JSON_KEY_PATH="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$JSON_KEY_PATH"

          fastlane supply \
            --aab "${bundles[0]}" \
            --track internal \
            --release_status draft \
            --package_name "$AAOS_APPLICATION_ID" \
            --json_key "$JSON_KEY_PATH" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true \
            --changes_not_sent_for_review false \
            --timeout 300

      - name: Write build summary
        if: always()
        run: |
          {
            echo '## AAOS Bundle Build'
            echo ''
            echo "- Version: ${JELLYFIN_VERSION}"
            echo "- Branch: ${{ github.event_name == 'schedule' && env.TARGET_BRANCH || github.ref_name }}"
            echo "- Bundle path: ${AAOS_BUNDLE_DIR}/*.aab"
            echo '- Play release status: draft'
            echo '- Play uploader: fastlane supply'
            if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.upload_to_play }}" != 'true' ]; then
              echo '- Play upload: skipped by manual input'
            else
              echo '- Play upload: attempted to internal track'
            fi
          } >> "$GITHUB_STEP_SUMMARY"